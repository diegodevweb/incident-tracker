name: Deploy

# Depois que o CI passa num push para a main, atualiza a produção para aquele
# commit (deploy/deploy.sh no servidor: backup, build, subida e volta à versão
# anterior se não ficar saudável). Também roda à mão: Actions > Deploy > Run
# workflow, que leva a produção ao topo da main.
#
# Enquanto o ambiente "production" não tiver os segredos DEPLOY_*, o job só
# avisa que o deploy não está configurado e termina sem erro.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

# Um deploy por vez, e nenhum cancelado no meio.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Produção
    # Só o push na main deste repositório: um PR de fork com uma branch
    # chamada main também dispara o CI, mas com outro evento e outro repositório.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - name: Deploy configurado?
        id: config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::Deploy automático não configurado: faltam os segredos DEPLOY_* no ambiente production. Nada foi feito."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Atualiza o servidor
        if: steps.config.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          # O commit que o CI testou (no disparo manual, o topo da main).
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # O servidor só aceita esta chave para rodar deploy/deploy.sh, que
          # recebe o commit como único argumento.
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$DEPLOY_HOST" "$COMMIT"
