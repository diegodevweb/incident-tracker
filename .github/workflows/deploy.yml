name: Deploy (PROD)

# Publica a main em produção quando você clica em Actions > Deploy (PROD) >
# Run workflow. Antes, espera o CI daquele commit terminar e só segue se ele
# passou. No servidor, deploy/deploy.sh faz o backup do banco, o build, a
# subida e volta à versão anterior se a nova não ficar saudável.
#
# Enquanto os segredos DEPLOY_* não existirem, o job só avisa e termina.
on:
  workflow_dispatch:

permissions:
  actions: read

# Um deploy por vez, e nenhum cancelado no meio.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Produção
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Só a main vai para produção
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Escolha a branch main em \"Use workflow from\"."
          exit 1

      - name: Deploy configurado?
        id: config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::Deploy não configurado: faltam os segredos DEPLOY_* do repositório. Nada foi feito."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: CI deste commit passou?
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          run_id=$(gh run list --workflow CI --commit "$COMMIT" --event push --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::Não há execução do CI para ${COMMIT:0:7} na main."
            exit 1
          fi
          # Se o CI ainda está rodando, espera; falha se ele falhou ou foi cancelado.
          if ! gh run watch "$run_id" --exit-status --interval 15 > /dev/null; then
            echo "::error::O CI de ${COMMIT:0:7} não passou; nada foi publicado."
            exit 1
          fi

      - name: Atualiza o servidor
        if: steps.config.outputs.enabled == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          COMMIT: ${{ github.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # O servidor só aceita esta chave para rodar deploy/deploy.sh, que
          # recebe o commit como único argumento.
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$DEPLOY_HOST" "$COMMIT"
