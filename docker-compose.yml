services:
  mysql:
    image: mysql:8.0
    container_name: incident_tracker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: incident_tracker
      MYSQL_USER: incident
      MYSQL_PASSWORD: incident
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: incident_tracker_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # Storage S3-compatível de desenvolvimento. Substitui o MinIO, cuja imagem
  # saiu do Docker Hub. Com as variáveis AWS_* o S3 exige essa chave, como o R2
  # em produção; a API usa as mesmas em STORAGE_ACCESS_KEY_ID/SECRET_ACCESS_KEY.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: incident_tracker_seaweedfs
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: incident
      AWS_SECRET_ACCESS_KEY: incident-dev-storage
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "127.0.0.1:9003:8333"
    volumes:
      - seaweedfs_data:/data

volumes:
  mysql_data:
  redis_data:
  seaweedfs_data:
